openapi: "3.1.0"
info:
  title: Api
  version: "1.0.0"
servers:
  - url: /api

paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      summary: Get current session user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      summary: Register new business account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "200":
          description: Registered and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /businesses:
    get:
      operationId: getBusinesses
      summary: List approved businesses (public, with filters)
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: brand
          in: query
          schema:
            type: string
        - name: featured
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: string
        - name: lng
          in: query
          schema:
            type: string
        - name: radius
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"

    post:
      operationId: createBusiness
      summary: Create a business listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"

  /businesses/owned:
    get:
      operationId: getOwnedBusinesses
      summary: Get businesses owned by the current user
      responses:
        "200":
          description: Owned businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"

  /businesses/stats:
    get:
      operationId: getBusinessStats
      summary: Site-wide stats for dashboard
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessStats"

  /businesses/{id}:
    get:
      operationId: getBusiness
      summary: Get a single business with photos, coupons, and brands
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Business detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: updateBusiness
      summary: Update a business (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

    delete:
      operationId: deleteBusiness
      summary: Delete a business (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /businesses/{id}/photos/{photoId}:
    delete:
      operationId: deletePhoto
      summary: Delete a photo from a business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: photoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /businesses/{id}/coupons/{couponId}:
    delete:
      operationId: deleteCoupon
      summary: Delete a coupon from a business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: couponId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/pending:
    get:
      operationId: getPendingBusinesses
      summary: Get pending business listings (admin)
      responses:
        "200":
          description: Pending businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessWithOwner"

  /admin/businesses:
    get:
      operationId: getAllBusinesses
      summary: Get all businesses (admin)
      responses:
        "200":
          description: All businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessWithOwner"

  /admin/businesses/{id}/approve:
    put:
      operationId: approveBusiness
      summary: Approve a business listing (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/businesses/{id}/reject:
    put:
      operationId: rejectBusiness
      summary: Reject a business listing with reason (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/businesses/{id}/feature:
    put:
      operationId: toggleFeatureBusiness
      summary: Toggle featured status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureResult"

  /admin/banner:
    get:
      operationId: getBanner
      summary: Get banner ad
      responses:
        "200":
          description: Banner ad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerAd"

  /admin/popup:
    get:
      operationId: getAdminPopup
      summary: Get popup ad (admin view)
      responses:
        "200":
          description: Popup ad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PopupAd"

  /brands:
    get:
      operationId: getBrands
      summary: List approved brands (public)
      responses:
        "200":
          description: Brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"

    post:
      operationId: createBrand
      summary: Add a brand (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /brands/suggest:
    post:
      operationId: suggestBrand
      summary: Suggest a new brand (public — creates pending brand for admin review)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandSuggestInput"
      responses:
        "201":
          description: Suggestion submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /brands/{id}:
    delete:
      operationId: deleteBrand
      summary: Delete a brand (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /brands/{id}/feature:
    put:
      operationId: toggleFeatureBrand
      summary: Toggle featured status for a brand (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureResult"

  /admin/brands:
    get:
      operationId: getAdminBrands
      summary: List all brands including pending (admin)
      responses:
        "200":
          description: All brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"

  /admin/brands/{id}/approve:
    put:
      operationId: approveBrand
      summary: Approve a pending brand (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /popup:
    get:
      operationId: getPopup
      summary: Get active popup ad (public)
      responses:
        "200":
          description: Popup ad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PopupAd"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    FeatureResult:
      type: object
      required: [is_featured]
      properties:
        is_featured:
          type: integer

    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string

    AuthResult:
      type: object
      required: [success, userId, role]
      properties:
        success:
          type: boolean
        userId:
          type: integer
        role:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    Brand:
      type: object
      required: [id, name, is_featured, status]
      properties:
        id:
          type: integer
        name:
          type: string
        is_featured:
          type: integer
        status:
          type: string

    BrandInput:
      type: object
      required: [name]
      properties:
        name:
          type: string

    BrandSuggestInput:
      type: object
      required: [name]
      properties:
        name:
          type: string

    Photo:
      type: object
      required: [id, business_id, photo_path, display_order]
      properties:
        id:
          type: integer
        business_id:
          type: integer
        photo_path:
          type: string
        display_order:
          type: integer

    Coupon:
      type: object
      required: [id, business_id, image_path]
      properties:
        id:
          type: integer
        business_id:
          type: integer
        image_path:
          type: string
        title:
          type: ["string", "null"]

    Business:
      type: object
      required: [id, owner_id, name, address, status, is_featured, created_at]
      properties:
        id:
          type: integer
        owner_id:
          type: integer
        name:
          type: string
        address:
          type: string
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        phone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        hours:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        logo_path:
          type: ["string", "null"]
        status:
          type: string
        rejection_reason:
          type: ["string", "null"]
        is_featured:
          type: integer
        created_at:
          type: string
        instagram:
          type: ["string", "null"]
        facebook:
          type: ["string", "null"]
        google_reviews_url:
          type: ["string", "null"]
        categories:
          type: array
          items:
            type: string
        brands:
          type: array
          items:
            $ref: "#/components/schemas/Brand"

    BusinessDetail:
      type: object
      required: [id, owner_id, name, address, status, is_featured, created_at, photos, coupons, brands, categories]
      properties:
        id:
          type: integer
        owner_id:
          type: integer
        name:
          type: string
        address:
          type: string
        street:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        zip:
          type: ["string", "null"]
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        phone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        hours:
          type: ["string", "null"]
        hours_json:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        logo_path:
          type: ["string", "null"]
        status:
          type: string
        rejection_reason:
          type: ["string", "null"]
        is_featured:
          type: integer
        created_at:
          type: string
        instagram:
          type: ["string", "null"]
        facebook:
          type: ["string", "null"]
        google_reviews_url:
          type: ["string", "null"]
        categories:
          type: array
          items:
            type: string
        photos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
        coupons:
          type: array
          items:
            $ref: "#/components/schemas/Coupon"
        brands:
          type: array
          items:
            $ref: "#/components/schemas/Brand"

    BusinessWithOwner:
      type: object
      required: [id, owner_id, name, address, status, is_featured, created_at, owner_email]
      properties:
        id:
          type: integer
        owner_id:
          type: integer
        name:
          type: string
        address:
          type: string
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        phone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        hours:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        logo_path:
          type: ["string", "null"]
        status:
          type: string
        rejection_reason:
          type: ["string", "null"]
        is_featured:
          type: integer
        created_at:
          type: string
        owner_email:
          type: string

    BusinessInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        address:
          type: string
        street:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        phone:
          type: string
        website:
          type: string
        hours:
          type: string
        hours_json:
          type: string
        description:
          type: string
        instagram:
          type: string
        facebook:
          type: string
        google_reviews_url:
          type: string
        categories:
          type: array
          items:
            type: string
        brand_ids:
          type: array
          items:
            type: integer

    BusinessUpdate:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        street:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        phone:
          type: string
        website:
          type: string
        hours:
          type: string
        hours_json:
          type: string
        description:
          type: string
        instagram:
          type: string
        facebook:
          type: string
        google_reviews_url:
          type: string
        categories:
          type: array
          items:
            type: string
        brand_ids:
          type: array
          items:
            type: integer

    RejectInput:
      type: object
      properties:
        reason:
          type: string

    BannerAd:
      type: object
      required: [id]
      properties:
        id:
          type: integer
        image_path:
          type: ["string", "null"]
        link_url:
          type: ["string", "null"]

    PopupAd:
      type: object
      required: [id, is_active]
      properties:
        id:
          type: integer
        image_path:
          type: ["string", "null"]
        link_url:
          type: ["string", "null"]
        is_active:
          type: integer

    BusinessStats:
      type: object
      required: [total, featured, pending, categories, brandCount]
      properties:
        total:
          type: integer
        featured:
          type: integer
        pending:
          type: integer
        brandCount:
          type: integer
        categories:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name:
                type: string
              count:
                type: integer
