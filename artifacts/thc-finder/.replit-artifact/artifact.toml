kind = "web"
previewPath = "/"
title = "THC Hemp Finder"
version = "1.0.0"
id = "artifacts/thc-finder"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18875

[services.development]
run = "pnpm --filter @workspace/thc-finder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/thc-finder", "run", "build" ]
publicDir = "artifacts/thc-finder/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18875"
BASE_PATH = "/"
